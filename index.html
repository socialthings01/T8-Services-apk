<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>T8 Services - Download App</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;

    background:
        radial-gradient(circle at 15% 15%,#312e81 0%,transparent 35%),
        radial-gradient(circle at 85% 20%,#0e7490 0%,transparent 32%),
        radial-gradient(circle at 50% 100%,#4c1d95 0%,transparent 35%),
        #030712;

    color:#fff;
}

.container{
    width:100%;
    max-width:430px;
}

.card{
    position:relative;
    overflow:hidden;

    padding:35px 22px;

    border-radius:25px;

    background:
        linear-gradient(
            145deg,
            rgba(15,23,42,.96),
            rgba(8,12,28,.94)
        );

    border:1px solid rgba(96,165,250,.25);

    box-shadow:
        0 25px 70px rgba(0,0,0,.5),
        inset 0 1px 0 rgba(255,255,255,.05);

    text-align:center;
}

.card::before{
    content:"";

    position:absolute;

    width:180px;
    height:180px;

    top:-100px;
    right:-70px;

    background:#38bdf8;
    opacity:.08;

    filter:blur(35px);
    border-radius:50%;
}

.logo{
    width:82px;
    height:82px;

    margin:0 auto 20px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:24px;

    background:
        linear-gradient(
            135deg,
            #4f46e5,
            #2563eb,
            #06b6d4
        );

    font-size:34px;
    font-weight:900;

    box-shadow:
        0 15px 40px rgba(37,99,235,.35),
        0 0 30px rgba(6,182,212,.15);
}

h1{
    font-size:32px;
    color:#f8fafc;

    text-shadow:
        0 0 25px rgba(96,165,250,.3);
}

.subtitle{
    margin-top:8px;

    color:#94a3b8;

    font-size:14px;
    line-height:1.6;
}

.download-btn,
.how-btn{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;

    width:100%;

    margin-top:28px;
    padding:16px;

    border-radius:14px;

    text-decoration:none;

    color:#fff;

    font-size:17px;
    font-weight:800;

    border:1px solid rgba(255,255,255,.12);

    transition:.2s ease;
}

.download-btn{
    background:
        linear-gradient(
            135deg,
            #4f46e5,
            #2563eb,
            #0891b2
        );

    box-shadow:
        0 10px 30px rgba(37,99,235,.3);
}

.how-btn{
    margin-top:12px;

    background:
        linear-gradient(
            135deg,
            #7c3aed,
            #4f46e5
        );

    box-shadow:
        0 10px 30px rgba(124,58,237,.25);
}

.download-btn:hover,
.how-btn:hover{
    transform:translateY(-2px);
}

.download-btn:hover{
    box-shadow:
        0 15px 35px rgba(37,99,235,.45);
}

.how-btn:hover{
    box-shadow:
        0 15px 35px rgba(124,58,237,.4);
}

.download-btn:active,
.how-btn:active{
    transform:scale(.98);
}

.note{
    margin-top:18px;

    color:#64748b;

    font-size:11px;
}

.footer{
    text-align:center;

    margin-top:18px;

    color:#475569;

    font-size:11px;
}

</style>
</head>

<body>

<div class="container">

    <div class="card">

        <div class="logo">
            T8
        </div>

        <h1>T8 Services</h1>

        <div class="subtitle">
            Download the official T8 Services application
        </div>

        <a
            class="download-btn"
            href="app.apk"
            download="T8-Services.apk"
        >
            📲 Download Application
        </a>

        <a
            class="how-btn"
            href="https://youtu.be/PcBoj-iCqw0?si=SPiPjEPt9EmE9TFS"
            target="_blank"
            rel="noopener noreferrer"
        >
            ▶️ How to Use
        </a>

        <div class="note">
            Android application • APK
        </div>

    </div>

    <div class="footer">
        © 2026 T8 Services
    </div>

</div>

</body>
</html>
